<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="输入月薪和工作时间，实时查看今天赚了多少钱，以及距离下班还有多久。">
  <meta property="og:title" content="薪动时刻｜下班倒计时与实时工资">
  <meta property="og:description" content="时间在走，工资在涨。">
  <title>薪动时刻｜下班倒计时与实时工资</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="topbar"><a class="brand" href="#top" aria-label="薪动时刻首页"><span class="brand-dot"></span>薪动时刻</a><span class="today" id="today"></span></header>
    <section class="hero" id="top">
      <div class="eyebrow">WORK SMART · COUNT HAPPY</div>
      <h1>时间在走，<br><em>工资在涨。</em></h1>
      <p class="intro">把漫长的工作日，换算成每一秒都看得见的收获。</p>
      <div class="dashboard">
        <section class="countdown-card" aria-live="polite">
          <div class="card-label"><span class="pulse"></span><span id="status">距离下班还有</span></div>
          <div class="countdown" id="countdown"><div><strong id="hours">00</strong><span>小时</span></div><b>:</b><div><strong id="minutes">00</strong><span>分钟</span></div><b>:</b><div><strong id="seconds">00</strong><span>秒</span></div></div>
          <div class="done" id="done" hidden>OFF<br>WORK!</div>
          <div class="progress-head"><span>今日进度</span><strong id="progressText">0.0%</strong></div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p class="pep-talk" id="pepTalk">再坚持一下，每一秒都有回报。</p>
        </section>
        <section class="earnings-card">
          <div class="card-label dark">今天已经赚到</div><div class="earned" id="earned">¥0.00</div><div class="ticker" id="perSecond">+ ¥0.00 / 秒</div>
          <div class="mini-stats"><div><span>每小时</span><strong id="hourPay">¥0.00</strong></div><div><span>今日应得</span><strong id="dayPay">¥0.00</strong></div></div>
        </section>
      </div>
    </section>
    <section class="settings-section">
      <div class="settings-copy"><span class="section-number">01</span><div><h2>算算你的<br>时间价值</h2><p>数据只保存在你的设备上，刷新页面也不会丢失。</p></div></div>
      <form class="settings-card" id="settings">
        <label><span>月薪（元）</span><div class="input-wrap"><i>¥</i><input aria-label="月薪" id="salary" type="number" min="0" step="100" value="15000"></div></label>
        <label><span>每月工作天数</span><div class="input-wrap"><input aria-label="每月工作天数" id="workdays" type="number" min="1" max="31" value="22"><i>天</i></div></label>
        <div class="time-fields"><label><span>上班时间</span><input aria-label="上班时间" id="start" type="time" value="09:00"></label><label><span>下班时间</span><input aria-label="下班时间" id="end" type="time" value="18:00"></label></div>
        <p class="formula">按 月薪 ÷ 工作天数 ÷ 每日工时 计算，收入每秒更新</p>
      </form>
    </section>
    <footer><span>愿每一次抬头，离下班都更近一点。</span><b>薪动时刻 © 2026</b></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
